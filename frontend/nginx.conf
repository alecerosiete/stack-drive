server {
  listen 80;
  root /usr/share/nginx/html;

  # Las rutas del panel (/drive/..., /accounts) las resuelve React Router en
  # el navegador: cualquier ruta que no sea un archivo sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los nombres de los assets llevan hash: se pueden cachear para siempre.
  # index.html no, o una versión nueva no llegaría hasta vaciar la caché.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
