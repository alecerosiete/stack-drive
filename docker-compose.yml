# Dependencias de infraestructura para desarrollo local.
# La API se ejecuta fuera del compose con `npm run start:dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: stackdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stackdrive
      POSTGRES_PASSWORD: stackdrive
      POSTGRES_DB: stackdrive
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stackdrive -d stackdrive']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stackdrive-redis
    restart: unless-stopped
    # appendonly: una transferencia encolada debe sobrevivir a un reinicio.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
